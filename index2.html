<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 赛事雷达 · 全网 AI 比赛聚合</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="masthead">
  <div class="masthead-rule"></div>
  <div class="masthead-inner">
    <div class="masthead-meta">
      <span id="today-line"></span>
      <span class="masthead-slogan">收录全网 AI 竞赛 · 黑客松 · 创作赛</span>
    </div>
    <h1 class="masthead-title">AI 赛事<em>雷达</em></h1>
    <div class="stats" id="stats"></div>
  </div>
  <div class="masthead-rule thin"></div>
</header>

<nav class="toolbar" id="toolbar">
  <div class="toolbar-inner">
    <input type="search" id="q" class="search" placeholder="搜索比赛 / 主办方 / 标签…">
    <div class="chip-group" id="status-chips" data-filter="status"></div>
    <div class="chip-group" id="type-chips" data-filter="type"></div>
    <div class="chip-group" id="region-chips" data-filter="region"></div>
    <button id="active-tag" class="chip active" hidden></button>
    <div class="toolbar-right">
      <button id="fav-toggle" class="chip fav-filter">★ 只看收藏</button>
      <select id="sort" class="select">
        <option value="deadline">按截止时间</option>
        <option value="prize">按奖金</option>
        <option value="start">按开始时间</option>
        <option value="name">按名称</option>
      </select>
      <div class="view-toggle" id="view-toggle">
        <button data-view="list" class="active">列表</button>
        <button data-view="calendar">日历</button>
      </div>
    </div>
  </div>
</nav>

<main class="content">
  <!-- 学校竞赛查询 -->
  <section id="school-query" style="max-width: 900px; margin: 0 auto 20px auto; padding: 0 16px;">
    <div style="background: #161b22; padding: 16px 20px; border-radius: 10px; border: 1px solid #30363d;">
      <h3 style="margin: 0 0 10px 0; font-size: 16px; color: #e6edf3;">🔍 查询本校认可竞赛</h3>
      <div style="display: flex; gap: 10px; flex-wrap: wrap;">
        <input type="text" id="schoolInput" placeholder="输入学校全称，如：苏州大学应用技术学院" style="flex: 1; min-width: 200px; padding: 8px 14px; border: 1px solid #30363d; border-radius: 6px; font-size: 14px; background: #0d1117; color: #e6edf3;">
        <button onclick="querySchool()" style="padding: 8px 24px; background: #1f6feb; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500;">查询</button>
      </div>
      <div id="schoolResult" style="margin-top: 12px;"></div>
    </div>
  </section>

  <section id="featured-section" hidden>
    <h2 class="section-title"><span class="tick"></span>官方重点赛事</h2>
    <div class="featured-grid" id="featured-grid"></div>
  </section>

  <section id="list-view">
    <div class="filter-bar" style="display: flex; gap: 10px; margin: 15px 0; flex-wrap: wrap;">
      <button class="chip active" id="filter-all">📋 全部</button>
      <button class="chip" id="filter-whitelist" style="border-color: #f0883e;">🏅 官方白名单</button>
    </div>
    <h2 class="section-title"><span class="tick"></span>全部赛事 <span class="count" id="list-count"></span></h2>
    <div class="card-grid" id="card-grid"></div>
    <p class="empty" id="empty" hidden>没有符合条件的比赛 —— 换个筛选条件试试。</p >
  </section>

  <section id="calendar-view" hidden>
    <div class="cal-header">
      <button id="cal-prev" class="cal-nav">‹</button>
      <h2 class="cal-title" id="cal-title"></h2>
      <button id="cal-next" class="cal-nav">›</button>
      <span class="cal-hint">标记为当日截止的比赛，点击查看详情</span>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
  </section>
</main>

<footer class="footer">
  <p>数据来源：各赛事官方页面 · <a href=" " target="_blank" rel="noopener">AI赛事通</a > 等公开渠道，仅作信息聚合，报名请以官方页面为准。</p >
  <p id="updated-line"></p >
</footer>

<div class="modal-backdrop" id="modal" hidden>
  <article class="modal" role="dialog" aria-modal="true">
    <button class="modal-close" id="modal-close" aria-label="关闭">×</button>
    <div class="modal-body" id="modal-body"></div>
  </article>
</div>

<script src="data/data.js"></script>
<script src="assets/app.js"></script>
<script>
// ===== 白名单筛选功能 =====
document.addEventListener('DOMContentLoaded', function() {
    var filterAll = document.getElementById('filter-all');
    var filterWhitelist = document.getElementById('filter-whitelist');

    if (filterAll && filterWhitelist) {
        function filterContests(type) {
            var cards = document.querySelectorAll('#card-grid .contest-card, #featured-grid .contest-card');
            cards.forEach(function(card) {
                if (type === 'all') {
                    card.style.display = '';
                } else if (type === 'whitelist') {
                    var isWhitelist = card.querySelector('.badge') !== null;
                    card.style.display = isWhitelist ? '' : 'none';
                }
            });
        }

        filterAll.addEventListener('click', function() {
            this.classList.add('active');
            filterWhitelist.classList.remove('active');
            filterContests('all');
        });

        filterWhitelist.addEventListener('click', function() {
            this.classList.add('active');
            filterAll.classList.remove('active');
            filterContests('whitelist');
        });
    }
});

// ===== 学校竞赛查询功能 =====
function querySchool() {
    var input = document.getElementById('schoolInput');
    var result = document.getElementById('schoolResult');
    if (!input || !result) return;

    var schoolName = input.value.trim();
    if (!schoolName) {
        result.innerHTML = '<p style="color: #8b949e; margin: 0;">请输入学校名称</p >';
        return;
    }

    result.innerHTML = '<p style="color: #8b949e; margin: 0;">⏳ 查询中...</p >';

    fetch('./data/schools/' + encodeURIComponent(schoolName) + '.json')
        .then(function(res) {
            if (!res.ok) throw new Error('未找到');
            return res.json();
        })
        .then(function(data) {
            if (data.recognized_competitions && data.recognized_competitions.length > 0) {
                var listHtml = '';
                data.recognized_competitions.forEach(function(name) {
                    listHtml += '<div style="background: #0d1117; padding: 10px 14px; margin-bottom: 6px; border-radius: 6px; border-left: 3px solid #1f6feb; cursor: pointer;" onclick="showContestDetail(\'' + encodeURIComponent(name) + '\')">' +
                        '<strong style="color: #e6edf3; font-size: 14px;">' + name + '</strong>' +
                        '</div>';
                });
                result.innerHTML = '<div style="background: #0d1117; padding: 14px 18px; border-radius: 8px; border: 1px solid #30363d;">' +
                    '<strong style="color: #58a6ff;">✅ ' + data.school + ' 认可的竞赛：</strong>' +
                    '<div style="margin-top: 10px;">' + listHtml + '</div>' +
                    '</div>';
            } else {
                result.innerHTML = '<p style="color: #f0883e; margin: 0;">该学校暂无认可的竞赛数据</p >';
            }
        })
        .catch(function() {
            result.innerHTML = '<p style="color: #da3633; margin: 0;">❌ 未找到 "' + schoolName + '" 的数据，欢迎在 GitHub 上贡献！</p >';
        });
}

// ===== 显示竞赛详情弹窗 =====
function showContestDetail(encodedName) {
    var name = decodeURIComponent(encodedName);
    // 从 window.contestData 中查找
    var allContests = window.contestData || [];
    var contest = null;
    for (var i = 0; i < allContests.length; i++) {
        if (allContests[i].name === name) {
            contest = allContests[i];
            break;
        }
    }
    if (!contest) {
        alert('未找到该赛事的详细数据');
        return;
    }
    var detailHtml =
        '<h3 style="margin: 0 0 10px 0; color: #e6edf3;">' + contest.name + '</h3>' +
        (contest.url ? '<p style="color: #c9d1d9;">🔗 <a href="' + contest.url + '" target="_blank" style="color: #58a6ff;">官网链接</a ></p >' : '') +
        (contest.start_date ? '<p style="color: #c9d1d9;">📅 开始时间：' + contest.start_date + '</p >' : '') +
        (contest.end_date ? '<p style="color: #c9d1d9;">⏰ 截止时间：' + contest.end_date + '</p >' : '') +
        (contest.location ? '<p style="color: #c9d1d9;">📍 地点：' + contest.location + '</p >' : '') +
        (contest.description ? '<p style="color: #c9d1d9;">📝 描述：' + contest.description + '</p >' : '') +
        (contest.tags ? '<p style="color: #c9d1d9;">🏷️ 标签：' + contest.tags.join('、') + '</p >' : '');

    var modal = document.getElementById('modal');
    var modalBody = document.getElementById('modal-body');
    if (modal && modalBody) {
        modalBody.innerHTML = detailHtml;
        modal.removeAttribute('hidden');
    } else {
        alert('弹窗组件未找到');
    }
}

// ===== 关闭弹窗 =====
document.addEventListener('DOMContentLoaded', function() {
    var closeBtn = document.getElementById('modal-close');
    var modal = document.getElementById('modal');

    if (closeBtn && modal) {
        closeBtn.addEventListener('click', function() {
            modal.setAttribute('hidden', '');
        });
        modal.addEventListener('click', function(e) {
            if (e.target === modal) {
                modal.setAttribute('hidden', '');
            }
        });
    }

    // 回车键触发查询
    var input = document.getElementById('schoolInput');
    if (input) {
        input.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                querySchool();
            }
        });
    }
});
</script>
</body>
</html>
